<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VDL · 下载队列</title>
  <base href="/app/vdl/">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="rail">
    <div class="rail-brand">
      <svg class="mark" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2.5" y="1" width="4.5" height="20" rx="1"/>
        <rect x="9.5" y="8" width="4.5" height="13" rx="1"/>
        <rect x="16.5" y="14" width="5" height="7" rx="1"/>
      </svg>
      <div class="brand-text">
        <strong>VDL</strong>
        <span>飞牛 NAS · 下载队列</span>
      </div>
    </div>

    <div class="rail-views">
      <p class="rail-label">队列</p>
      <div class="view-list" id="filter" role="group" aria-label="任务筛选">
        <button type="button" data-filter="all" aria-pressed="true">全部<span data-count="all">0</span></button>
        <button type="button" data-filter="running" aria-pressed="false">进行中<span data-count="running">0</span></button>
        <button type="button" data-filter="toMerge" aria-pressed="false">待合并<span data-count="toMerge">0</span></button>
        <button type="button" data-filter="failed" aria-pressed="false">失败<span data-count="failed">0</span></button>
        <button type="button" data-filter="finished" aria-pressed="false">已完成<span data-count="finished">0</span></button>
      </div>
    </div>

    <div class="rail-foot">
      <p class="rail-label">数据目录</p>
      <p class="rail-path" id="dataDir" title="">—</p>
      <p class="rail-version">VDL <span id="appVersion">—</span></p>
    </div>
  </aside>

  <main class="workspace">
    <header class="page-head">
      <div class="page-title">
        <h1>下载队列</h1>
        <p class="finding" id="pageFinding">正在读取任务…</p>
      </div>
      <div class="page-actions">
        <span class="stamp" id="freshness"></span>
        <button type="button" class="btn ghost" id="refreshBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 11a8 8 0 1 0-2.6 6"/><path d="M20 4v7h-7"/>
          </svg>
          刷新
        </button>
        <button type="button" class="btn primary" id="openAddTask">新增任务</button>
      </div>
    </header>

    <section class="kpis" aria-label="队列统计">
      <div class="kpi">
        <span class="kpi-label">进行中</span>
        <strong class="kpi-value num" id="statRunning">0</strong>
      </div>
      <div class="kpi">
        <span class="kpi-label">待合并</span>
        <strong class="kpi-value num" id="statToMerge">0</strong>
      </div>
      <div class="kpi">
        <span class="kpi-label">失败</span>
        <strong class="kpi-value num" id="statFailed">0</strong>
      </div>
      <div class="kpi">
        <span class="kpi-label">已完成</span>
        <strong class="kpi-value num" id="statDone">0</strong>
      </div>
      <div class="kpi">
        <span class="kpi-label">已下载</span>
        <strong class="kpi-value num" id="statVolume">0 B</strong>
      </div>
    </section>

    <div class="notice" id="pageNotice" role="status" hidden>
      <span id="noticeText"></span>
      <button type="button" class="btn ghost small" id="noticeRetry">重试</button>
    </div>

    <section class="queue" aria-labelledby="queueTitle">
      <div class="queue-head">
        <h2 id="queueTitle"><span id="queueTitleText">全部任务</span><span class="queue-count num" id="queueCount">0</span></h2>
        <div class="queue-tools">
          <button type="button" class="btn ghost small" id="mergeAllBtn">一键合并</button>
          <button type="button" class="btn ghost small" id="moveAllBtn">一键移动</button>
          <button type="button" class="btn ghost small danger" id="deleteAllBtn">全部删除</button>
        </div>
      </div>

      <div class="list-head" aria-hidden="true">
        <span>任务</span>
        <span>状态</span>
        <span>切片进度</span>
        <span class="num">大小</span>
        <span class="num">创建</span>
        <span>位置</span>
        <span></span>
      </div>

      <div class="task-list" id="taskList">
        <div class="loading">正在读取任务…</div>
      </div>
    </section>
  </main>

  <dialog id="taskDialog" class="dialog">
    <form class="dialog-body" id="taskForm">
      <div class="dialog-head">
        <h2>新增任务</h2>
        <button type="button" class="icon-btn" id="closeTaskDialog" aria-label="关闭">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>

      <label>
        <span>资源类型</span>
        <select id="resourceType" name="resourceType">
          <option value="ruyi">如意资源</option>
          <option value="bfzy">暴风资源</option>
          <option value="other">其他</option>
        </select>
      </label>

      <div class="source-panel" id="otherFields">
        <label>
          <span>m3u8 地址</span>
          <input id="m3u8Url" name="m3u8Url" type="url" autocomplete="off" placeholder="https://…/index.m3u8">
        </label>
        <label>
          <span>切片 Base 地址</span>
          <input id="baseUrl" name="baseUrl" type="url" autocomplete="off" placeholder="默认使用 m3u8 地址去掉最后一段">
        </label>
        <label>
          <span>生成视频名称</span>
          <input id="outputName" name="outputName" type="text" autocomplete="off" placeholder="video.mp4">
        </label>
      </div>

      <div class="source-panel" id="ruyiFields">
        <label>
          <span>视频地址</span>
          <input id="videoAddress" name="videoAddress" type="url" autocomplete="off" placeholder="播放器地址或采集站 index.m3u8 地址">
        </label>
        <div class="form-grid">
          <label>
            <span>来源页</span>
            <select id="sourcePage" name="sourcePage">
              <option value="auto">自动识别</option>
              <option value="libretv">LibreTV</option>
              <option value="kvedio">KVideo</option>
            </select>
          </label>
          <label>
            <span>下载范围</span>
            <select id="ruyiMode" name="ruyiMode">
              <option value="single">单集</option>
              <option value="all">全集</option>
              <option value="partial">部分</option>
            </select>
          </label>
        </div>
        <label id="episodeNameRow">
          <span>单集名称</span>
          <input id="episodeName" name="episodeName" type="text" autocomplete="off" placeholder="例如：第01集">
        </label>
        <label id="episodeSelectRow" hidden>
          <span>选择集数</span>
          <input id="episodeSelect" name="episodeSelect" type="text" autocomplete="off" placeholder="例如：1;2;4 或 2-6，可混用 1;3-5">
          <small>用 ; , ， ； 或空格分隔集号，支持 2-6 / 2~6 范围，最多到该剧总集数</small>
        </label>
        <label id="taskConcurrencyRow">
          <span>任务并发数</span>
          <input id="taskConcurrency" name="taskConcurrency" type="number" min="1" max="20" value="2">
        </label>
      </div>

      <label>
        <span>临时下载目录</span>
        <input id="tempRoot" name="tempRoot" type="text" autocomplete="off">
      </label>

      <div class="form-grid">
        <label>
          <span>切片并发</span>
          <input id="concurrency" name="concurrency" type="number" min="1" max="128" value="32">
        </label>
        <label>
          <span>失败重试</span>
          <input id="retries" name="retries" type="number" min="0" max="20" value="3">
        </label>
      </div>

      <label class="toggle">
        <input id="autoMerge" name="autoMerge" type="checkbox">
        <span>下载完成后自动合并</span>
      </label>

      <label class="toggle">
        <input id="removeAds" name="removeAds" type="checkbox" checked>
        <span>下载完成后去除广告</span>
      </label>

      <p class="message" id="formMessage"></p>
      <div class="dialog-actions">
        <button type="button" class="btn" id="cancelTask">取消</button>
        <button class="btn primary" type="submit">开始下载</button>
      </div>
    </form>
  </dialog>

  <dialog id="moveDialog" class="dialog">
    <form method="dialog" class="dialog-body" id="moveForm">
      <div class="dialog-head">
        <h2>移动视频</h2>
        <button type="button" class="icon-btn" id="cancelMove" aria-label="关闭">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>
      <label>
        <span>目标目录</span>
        <div class="input-row">
          <input id="moveDest" type="text" required placeholder="/vol1/1000/videos">
          <button type="button" class="btn" id="openMoveBrowse">选择目录</button>
        </div>
      </label>
      <div class="dialog-actions">
        <button class="btn primary" value="confirm" type="submit">移动</button>
      </div>
    </form>
  </dialog>

  <dialog id="browseDialog" class="dialog">
    <div class="dialog-body">
      <div class="dialog-head">
        <h2>选择目录</h2>
        <button type="button" class="icon-btn" id="closeBrowse" aria-label="关闭">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>
      <div class="browse-path num" id="browsePath">—</div>
      <div class="browse-list" id="browseList"></div>
      <div class="dialog-actions">
        <button type="button" class="btn" id="browseParent">上一级</button>
        <button class="btn primary" type="button" id="selectBrowsePath">选择当前目录</button>
      </div>
    </div>
  </dialog>

  <dialog id="playerDialog" class="dialog player-dialog">
    <div class="dialog-body">
      <div class="dialog-head">
        <h2 id="playerTitle">播放视频</h2>
        <button type="button" class="icon-btn" id="closePlayer" aria-label="关闭">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>
      <video id="playerVideo" controls playsinline preload="metadata"></video>
      <p class="message" id="playerMessage"></p>
      <div class="dialog-actions">
        <button class="btn" type="button" id="closePlayerBtn">关闭</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="main.js"></script>
</body>
</html>
